<!--
  Dark by default: on a visitor's first visit (no saved preference) switch to dark.
  Runs after the theme script and before the page is painted; any later choice
  made with the theme switcher is saved by Chirpy and respected from then on.
-->
<script>
  (function () {
    try {
      if (!localStorage.getItem('theme') && !localStorage.getItem('jg-theme-default')) {
        localStorage.setItem('theme', 'dark');
        document.documentElement.setAttribute('data-bs-theme', 'dark');
        document.documentElement.setAttribute('data-theme-persisted', '');
      }
      localStorage.setItem('jg-theme-default', '1');
    } catch (e) {}
  })();
</script>
